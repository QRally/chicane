<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Chicane Telemetry v1.2</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #080b11;
            color: #e2e8f0;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .font-mono-digital {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Flash animations for instant cockpit feedback */
        @keyframes flash-blue {
            0%, 100% { background-color: rgba(6, 182, 212, 0.15); border-color: #06b6d4; box-shadow: 0 0 35px rgba(6, 182, 212, 0.5); }
            50% { background-color: rgba(6, 182, 212, 0.35); border-color: #22d3ee; box-shadow: 0 0 60px rgba(34, 211, 238, 0.8); }
        }

        @keyframes flash-red {
            0%, 100% { background-color: rgba(225, 29, 72, 0.2); border-color: #e11d48; box-shadow: 0 0 40px rgba(225, 29, 72, 0.6); }
            50% { background-color: rgba(225, 29, 72, 0.45); border-color: #f43f5e; box-shadow: 0 0 70px rgba(244, 63, 94, 0.9); }
        }

        @keyframes flash-green {
            0%, 100% { background-color: rgba(16, 185, 129, 0.2); border-color: #10b981; box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
            50% { background-color: rgba(16, 185, 129, 0.4); border-color: #34d399; box-shadow: 0 0 70px rgba(52, 211, 153, 0.9); }
        }

        .state-neutral {
            border-color: #334155;
            background-color: rgba(15, 23, 42, 0.8);
        }

        .state-entering {
            animation: flash-blue 0.6s infinite alternate;
        }

        .state-cleared {
            animation: flash-green 0.8s infinite alternate;
        }

        .state-overspeed {
            animation: flash-red 0.3s infinite alternate;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between p-3 box-border overflow-hidden">

    <!-- Compact Header Bar -->
    <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-3 py-2 flex-shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-flag-checkered text-cyan-400 text-sm"></i>
            <h1 id="app-title" class="text-xs font-black tracking-wider text-white">VIRTUAL CHICANE</h1>
        </div>

        <div class="flex items-center gap-1.5 font-mono-digital text-xs">
            <!-- Micro GPS Status Badge -->
            <div id="gps-status-badge" class="flex items-center gap-1 bg-slate-800 px-2 py-0.5 rounded-lg border border-slate-700">
                <span id="gps-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping"></span>
                <span id="gps-status-text" class="text-amber-400 font-bold text-[10px] tracking-tight">INIT GPS</span>
            </div>

            <button onclick="toggleAudio()" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300">
                <i id="audio-icon" class="fa-solid fa-volume-high text-cyan-400 text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Dynamic Cockpit HUD -->
    <main id="hud-card" class="state-neutral border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200">
        
        <!-- Target Chicane & Limit Banner -->
        <div class="w-full flex items-center justify-between font-mono-digital text-xs uppercase px-1">
            <div class="flex flex-col">
                <span id="disp-target-id" class="text-[10px] text-cyan-400 font-bold tracking-wider">TARGET: SEARCHING...</span>
                <span class="text-slate-400 text-xs">LIMIT: <strong id="disp-limit" class="text-cyan-400 text-xs sm:text-sm">-- MPH</strong></span>
            </div>
            <span id="disp-distance" class="text-slate-300 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800 text-xs font-bold">DIST: -- m</span>
        </div>

        <!-- Main Center Speed / GO Display -->
        <div class="flex flex-col items-center justify-center my-auto">
            <div id="speed-display" class="font-black text-7xl sm:text-8xl tracking-tighter text-white leading-none">
                0
            </div>
            <div id="unit-display" class="text-lg sm:text-xl font-bold text-slate-400 mt-1 font-mono-digital">
                MPH
            </div>
            
            <!-- Immediate Clearance Visual Confirmation -->
            <div id="clearance-banner" class="hidden mt-2 px-5 py-1.5 bg-emerald-500 text-slate-950 font-black text-2xl rounded-2xl tracking-widest shadow-lg shadow-emerald-500/50">
                GO!
            </div>
        </div>

        <!-- Minimal Progress Bar -->
        <div class="w-full bg-slate-950 border border-slate-800 h-2.5 rounded-full overflow-hidden p-0.5">
            <div id="speed-bar" class="h-full bg-cyan-400 rounded-full transition-all duration-150" style="width: 0%;"></div>
        </div>
    </main>

    <!-- Bottom Telemetry Strip -->
    <footer class="grid grid-cols-3 gap-2 font-mono-digital text-center flex-shrink-0">
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5">
            <p class="text-[9px] text-slate-400 uppercase font-bold">Min Speed</p>
            <p id="tel-min-speed" class="text-sm font-bold text-slate-200">--</p>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5">
            <p class="text-[9px] text-slate-400 uppercase font-bold">GPS Accuracy</p>
            <p id="tel-accuracy" class="text-sm font-bold text-emerald-400">-- m</p>
        </div>
        <button onclick="exportPassLogs()" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-800 rounded-xl p-1.5 flex flex-col items-center justify-center active:scale-95 transition-all">
            <p class="text-[9px] text-cyan-400 uppercase font-bold flex items-center gap-1">
                <i class="fa-solid fa-download text-[8px]"></i> Export JSON
            </p>
            <p id="tel-log-count" class="text-sm font-bold text-slate-200">LOG (0)</p>
        </button>
    </footer>

    <!-- Telemetry Core JS -->
    <script>
        // Fallback default route if route.json isn't present
        let routeData = {
            event: "EVENT ROUTE",
            chicanes: [
                { id: "CHICANE 1", lat: 53.1887, lng: -3.1254, limit_mph: 37 }
            ]
        };

        let currentTarget = null;
        let geofenceMeters = 100;

        let currentDistance = null;
        let currentSpeedMPH = 0;
        let minZoneSpeedMPH = Infinity;
        let inZone = false;
        let clearedZone = false;
        let audioEnabled = true;

        let currentLat = null;
        let currentLng = null;
        let currentAccuracy = 0;

        // Pass History Memory Array
        let passLogs = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Load JSON Event Data on boot
        async function loadRouteJSON() {
            try {
                const response = await fetch('route.json');
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.chicanes && data.chicanes.length > 0) {
                        routeData = data;
                        document.getElementById('app-title').innerText = routeData.event.toUpperCase();
                    }
                }
            } catch (e) {
                console.log('Using default inline route dataset.');
            }
        }

        function playBeep(freq, duration) {
            if (!audioEnabled || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Auto-select nearest upcoming chicane from JSON list
        function updateNearestChicane(lat, lng) {
            if (!routeData.chicanes || routeData.chicanes.length === 0) return;

            let closest = null;
            let minDistance = Infinity;

            routeData.chicanes.forEach(chicane => {
                const dist = getDistanceMeters(lat, lng, chicane.lat, chicane.lng);
                if (dist < minDistance) {
                    minDistance = dist;
                    closest = chicane;
                }
            });

            if (closest) {
                // If target changes, reset zone cleared states
                if (!currentTarget || currentTarget.id !== closest.id) {
                    currentTarget = closest;
                    clearedZone = false;
                    inZone = false;
                    minZoneSpeedMPH = Infinity;
                    document.getElementById('tel-min-speed').innerText = '--';
                }

                document.getElementById('disp-target-id').innerText = `TARGET: ${currentTarget.id}`;
                document.getElementById('disp-limit').innerText = `${currentTarget.limit_mph} MPH`;
                currentDistance = minDistance;
            }
        }

        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;
                        currentAccuracy = pos.coords.accuracy;
                        const rawSpeed = pos.coords.speed !== null ? pos.coords.speed : 0;
                        currentSpeedMPH = Math.round(rawSpeed * 2.23694);

                        // Find closest chicane automatically
                        updateNearestChicane(currentLat, currentLng);

                        document.getElementById('gps-status-text').innerText = 'GPS ACTIVE';
                        document.getElementById('gps-status-text').className = 'text-emerald-400 font-bold text-[10px] tracking-tight';
                        document.getElementById('gps-dot').className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse';
                        document.getElementById('tel-accuracy').innerText = `± ${currentAccuracy.toFixed(1)} m`;

                        if (currentTarget) {
                            processTelemetry(currentDistance, currentSpeedMPH, currentTarget.limit_mph);
                        }
                    },
                    err => {
                        document.getElementById('gps-status-text').innerText = 'GPS ERR';
                        document.getElementById('gps-status-text').className = 'text-rose-400 font-bold text-[10px] tracking-tight';
                        document.getElementById('gps-dot').className = 'w-1.5 h-1.5 rounded-full bg-rose-500';
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        function recordPassLog() {
            if (!currentTarget || minZoneSpeedMPH === Infinity) return;

            const logEntry = {
                timestamp: new Date().toISOString(),
                event: routeData.event,
                target_id: currentTarget.id,
                speed_limit_mph: currentTarget.limit_mph,
                min_recorded_speed_mph: minZoneSpeedMPH,
                passed_compliance: minZoneSpeedMPH <= currentTarget.limit_mph,
                gps_accuracy_m: parseFloat(currentAccuracy.toFixed(1)),
                car_coords: {
                    lat: currentLat,
                    lng: currentLng
                }
            };

            passLogs.push(logEntry);
            document.getElementById('tel-log-count').innerText = `LOG (${passLogs.length})`;
        }

        function exportPassLogs() {
            if (passLogs.length === 0) {
                alert("No chicane passes logged yet in this session.");
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(passLogs, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `chicane_pass_logs_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function processTelemetry(dist, speed, speedLimit) {
            document.getElementById('speed-display').innerText = speed;

            // Clean distance formatting
            const distText = dist >= 1000 
                ? `${(dist / 1000).toFixed(1)} km` 
                : `${Math.round(dist)} m`;
            document.getElementById('disp-distance').innerText = `DIST: ${distText}`;

            document.getElementById('speed-bar').style.width = `${Math.min(100, (speed / 80) * 100)}%`;

            const hud = document.getElementById('hud-card');
            const clearanceBanner = document.getElementById('clearance-banner');

            // Inside 100m Geofence
            if (dist <= geofenceMeters) {
                if (!inZone) {
                    inZone = true;
                    clearedZone = false;
                    minZoneSpeedMPH = speed;
                    playBeep(880, 0.2); // Entry chime
                } else {
                    if (speed < minZoneSpeedMPH) minZoneSpeedMPH = speed;
                }

                document.getElementById('tel-min-speed').innerText = `${minZoneSpeedMPH} MPH`;

                // Compliance Check
                if (speed <= speedLimit || clearedZone) {
                    if (!clearedZone) {
                        clearedZone = true;
                        playBeep(1200, 0.3); // Instant confirmation chime
                    }
                    hud.className = 'state-cleared border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    clearanceBanner.classList.remove('hidden');
                } else {
                    hud.className = 'state-overspeed border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    clearanceBanner.classList.add('hidden');
                    playBeep(440, 0.1);
                }
            } else {
                // Approaching or Leaving Zone (100m - 180m)
                if (dist <= geofenceMeters + 80) {
                    if (clearedZone) {
                        // Hold solid green state while accelerating out of zone
                        hud.className = 'state-cleared border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                        clearanceBanner.classList.remove('hidden');
                    } else {
                        // Flash blue on approach
                        hud.className = 'state-entering border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    }
                } else {
                    // Completely clear (>180m) - Record Log & reset HUD for next chicane
                    if (inZone) {
                        recordPassLog(); // Silent automatic record entry
                        inZone = false;
                    }

                    hud.className = 'state-neutral border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    clearedZone = false;
                    clearanceBanner.classList.add('hidden');
                }
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            if (audioEnabled && audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('audio-icon').className = audioEnabled ? 'fa-solid fa-volume-high text-cyan-400' : 'fa-solid fa-volume-xmark text-slate-500';
        }

        window.addEventListener('load', async () => {
            await loadRouteJSON();
            initGPS();
        });
    </script>
</body>
</html>
