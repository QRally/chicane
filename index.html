<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Virtual Chicane Telemetry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #080b11;
            color: #e2e8f0;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .font-mono-digital {
            font-family: 'Share Tech Mono', monospace;
        }

        /* Flash animations for instant cockpit feedback */
        @keyframes flash-blue {
            0%, 100% { background-color: rgba(6, 182, 212, 0.15); border-color: #06b6d4; box-shadow: 0 0 35px rgba(6, 182, 212, 0.5); }
            50% { background-color: rgba(6, 182, 212, 0.35); border-color: #22d3ee; box-shadow: 0 0 60px rgba(34, 211, 238, 0.8); }
        }

        @keyframes flash-red {
            0%, 100% { background-color: rgba(225, 29, 72, 0.2); border-color: #e11d48; box-shadow: 0 0 40px rgba(225, 29, 72, 0.6); }
            50% { background-color: rgba(225, 29, 72, 0.45); border-color: #f43f5e; box-shadow: 0 0 70px rgba(244, 63, 94, 0.9); }
        }

        @keyframes flash-green {
            0%, 100% { background-color: rgba(16, 185, 129, 0.2); border-color: #10b981; box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
            50% { background-color: rgba(16, 185, 129, 0.4); border-color: #34d399; box-shadow: 0 0 70px rgba(52, 211, 153, 0.9); }
        }

        .state-neutral {
            border-color: #334155;
            background-color: rgba(15, 23, 42, 0.8);
        }

        .state-entering {
            animation: flash-blue 0.6s infinite alternate;
        }

        .state-cleared {
            animation: flash-green 0.8s infinite alternate;
        }

        .state-overspeed {
            animation: flash-red 0.3s infinite alternate;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between p-3 box-border overflow-hidden">

    <!-- Compact Header Bar -->
    <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-3 py-2 flex-shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-flag-checkered text-cyan-400 text-base"></i>
            <h1 class="text-xs sm:text-sm font-black tracking-wider text-white">VIRTUAL CHICANE</h1>
        </div>

        <div class="flex items-center gap-2 font-mono-digital text-xs">
            <div id="gps-status-badge" class="flex items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-xl border border-slate-700">
                <span id="gps-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
                <span id="gps-status-text" class="text-amber-400 font-bold text-[11px]">INIT GPS</span>
            </div>

            <button onclick="toggleAudio()" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300">
                <i id="audio-icon" class="fa-solid fa-volume-high text-cyan-400 text-xs"></i>
            </button>
            <button onclick="toggleModal('modal-settings')" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>
        </div>
    </header>

    <!-- Main Dynamic Cockpit HUD -->
    <main id="hud-card" class="state-neutral border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200">
        
        <!-- Status Banner -->
        <div class="w-full flex items-center justify-between font-mono-digital text-xs uppercase px-1">
            <span class="text-slate-400">LIMIT: <strong id="disp-limit" class="text-cyan-400 text-xs sm:text-sm">37 MPH</strong></span>
            <span id="disp-distance" class="text-slate-300 bg-slate-900 px-2.5 py-0.5 rounded-lg border border-slate-800 text-xs">DIST: -- m</span>
        </div>

        <!-- Main Center Speed / GO Display -->
        <div class="flex flex-col items-center justify-center my-auto">
            <div id="speed-display" class="font-black text-7xl sm:text-8xl tracking-tighter text-white leading-none">
                0
            </div>
            <div id="unit-display" class="text-lg sm:text-xl font-bold text-slate-400 mt-1 font-mono-digital">
                MPH
            </div>
            
            <!-- Immediate Clearance Visual Confirmation -->
            <div id="clearance-banner" class="hidden mt-2 px-5 py-1.5 bg-emerald-500 text-slate-950 font-black text-2xl rounded-2xl tracking-widest shadow-lg shadow-emerald-500/50">
                GO!
            </div>
        </div>

        <!-- Minimal Progress Bar -->
        <div class="w-full bg-slate-950 border border-slate-800 h-2.5 rounded-full overflow-hidden p-0.5">
            <div id="speed-bar" class="h-full bg-cyan-400 rounded-full transition-all duration-150" style="width: 0%;"></div>
        </div>
    </main>

    <!-- Bottom Telemetry Strip -->
    <footer class="grid grid-cols-3 gap-2 font-mono-digital text-center flex-shrink-0">
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5">
            <p class="text-[9px] text-slate-400 uppercase font-bold">Min Speed</p>
            <p id="tel-min-speed" class="text-sm font-bold text-slate-200">--</p>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5">
            <p class="text-[9px] text-slate-400 uppercase font-bold">GPS Accuracy</p>
            <p id="tel-accuracy" class="text-sm font-bold text-emerald-400">-- m</p>
        </div>
        <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-1.5">
            <p class="text-[9px] text-slate-400 uppercase font-bold">Pass Status</p>
            <p id="tel-status" class="text-sm font-bold text-slate-400">READY</p>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="modal-settings" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-4 space-y-3 font-mono-digital">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white text-xs">CHICANE SETTINGS</h3>
                <button onclick="toggleModal('modal-settings')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <div>
                    <label class="block text-slate-400 mb-0.5">LATITUDE</label>
                    <input id="input-lat" type="number" step="any" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-0.5">LONGITUDE</label>
                    <input id="input-lng" type="number" step="any" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-0.5">MAX SPEED LIMIT (MPH)</label>
                    <input id="input-limit" type="number" value="37" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white">
                </div>
            </div>
            <div class="flex gap-2 pt-1">
                <button onclick="setChicaneHere()" class="flex-1 py-2 bg-slate-800 border border-slate-700 text-cyan-400 rounded-lg font-bold text-xs">
                    <i class="fa-solid fa-crosshairs"></i> SET HERE
                </button>
                <button onclick="saveSettings()" class="flex-1 py-2 bg-cyan-500 text-slate-950 rounded-lg font-bold text-xs">
                    SAVE
                </button>
            </div>
        </div>
    </div>

    <!-- Telemetry Core JS -->
    <script>
        let chicaneCoords = { lat: 53.1887, lng: -3.1254 };
        let speedLimitMPH = 37;
        let geofenceMeters = 100;

        let currentDistance = null;
        let currentSpeedMPH = 0;
        let minZoneSpeedMPH = Infinity;
        let inZone = false;
        let clearedZone = false;
        let audioEnabled = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq, duration) {
            if (!audioEnabled || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    pos => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        const accuracy = pos.coords.accuracy;
                        const rawSpeed = pos.coords.speed !== null ? pos.coords.speed : 0;
                        currentSpeedMPH = Math.round(rawSpeed * 2.23694);

                        currentDistance = getDistanceMeters(lat, lng, chicaneCoords.lat, chicaneCoords.lng);

                        document.getElementById('gps-status-text').innerText = 'GPS ACTIVE';
                        document.getElementById('gps-status-text').className = 'text-emerald-400 font-bold text-[11px]';
                        document.getElementById('gps-dot').className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
                        document.getElementById('tel-accuracy').innerText = `± ${accuracy.toFixed(1)} m`;

                        processTelemetry(currentDistance, currentSpeedMPH);
                    },
                    err => {
                        document.getElementById('gps-status-text').innerText = 'GPS ERROR';
                        document.getElementById('gps-status-text').className = 'text-rose-400 font-bold text-[11px]';
                        document.getElementById('gps-dot').className = 'w-2 h-2 rounded-full bg-rose-500';
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        function processTelemetry(dist, speed) {
            document.getElementById('speed-display').innerText = speed;
            document.getElementById('disp-distance').innerText = `DIST: ${Math.round(dist)} m`;
            document.getElementById('speed-bar').style.width = `${Math.min(100, (speed / 80) * 100)}%`;

            const hud = document.getElementById('hud-card');
            const clearanceBanner = document.getElementById('clearance-banner');
            const statusText = document.getElementById('tel-status');

            // Entering Geofence
            if (dist <= geofenceMeters) {
                if (!inZone) {
                    inZone = true;
                    clearedZone = false;
                    minZoneSpeedMPH = speed;
                    playBeep(880, 0.2); // Beep on zone entry
                } else {
                    if (speed < minZoneSpeedMPH) minZoneSpeedMPH = speed;
                }

                document.getElementById('tel-min-speed').innerText = `${minZoneSpeedMPH} MPH`;

                // Speed Check Logic: Instantly confirm compliance once speed drops below threshold
                if (speed <= speedLimitMPH || clearedZone) {
                    if (!clearedZone) {
                        clearedZone = true;
                        playBeep(1200, 0.3); // Instant confirmation chime
                    }
                    hud.className = 'state-cleared border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    clearanceBanner.classList.remove('hidden');
                    statusText.innerText = 'CLEARED';
                    statusText.className = 'text-sm font-bold text-emerald-400';
                } else {
                    // Entering / Overspeed state
                    hud.className = 'state-overspeed border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    clearanceBanner.classList.add('hidden');
                    statusText.innerText = 'CHECK SPEED';
                    statusText.className = 'text-sm font-bold text-rose-400';
                    playBeep(440, 0.1);
                }
            } else {
                // Flash BLUE when approaching near geofence boundary (100m to 180m)
                if (dist <= geofenceMeters + 80) {
                    hud.className = 'state-entering border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    statusText.innerText = 'APPROACHING';
                    statusText.className = 'text-sm font-bold text-cyan-400';
                } else {
                    hud.className = 'state-neutral border-4 rounded-3xl my-2 p-3 flex-1 flex flex-col items-center justify-between min-h-0 transition-all duration-200';
                    statusText.innerText = 'READY';
                    statusText.className = 'text-sm font-bold text-slate-400';
                }

                if (inZone) {
                    inZone = false;
                }
                clearanceBanner.classList.add('hidden');
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            if (audioEnabled && audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('audio-icon').className = audioEnabled ? 'fa-solid fa-volume-high text-cyan-400' : 'fa-solid fa-volume-xmark text-slate-500';
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('input-lat').value = chicaneCoords.lat;
                document.getElementById('input-lng').value = chicaneCoords.lng;
                document.getElementById('input-limit').value = speedLimitMPH;
            }
        }

        function saveSettings() {
            const lat = parseFloat(document.getElementById('input-lat').value);
            const lng = parseFloat(document.getElementById('input-lng').value);
            const limit = parseInt(document.getElementById('input-limit').value, 10);

            if (!isNaN(lat) && !isNaN(lng)) {
                chicaneCoords.lat = lat;
                chicaneCoords.lng = lng;
            }
            if (!isNaN(limit) && limit > 0) {
                speedLimitMPH = limit;
                document.getElementById('disp-limit').innerText = `${speedLimitMPH} MPH`;
            }
            toggleModal('modal-settings');
        }

        function setChicaneHere() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(pos => {
                    chicaneCoords.lat = pos.coords.latitude;
                    chicaneCoords.lng = pos.coords.longitude;
                    document.getElementById('input-lat').value = chicaneCoords.lat;
                    document.getElementById('input-lng').value = chicaneCoords.lng;
                    alert('Chicane set to current location!');
                });
            }
        }

        window.addEventListener('load', () => {
            initGPS();
        });
    </script>
</body>
</html>
